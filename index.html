<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Orb Runner</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>Orb Runner</h1>
    <canvas id="game" width="640" height="480"></canvas>
    <button id="pause-btn" type="button">Pause</button>
    <p class="help help-keys">Move with arrow keys or WASD. Collect gold orbs, avoid red blocks. Press P to pause.</p>
    <p class="help help-touch">Drag anywhere on the game to move. Collect gold orbs, avoid red blocks.</p>
  </main>
  <script src="game.js"></script>
</body>
</html>
