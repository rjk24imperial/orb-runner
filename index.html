<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#12141c">
  <title>Orb Runner</title>
  <!-- Bump ?v= when you change these files so browsers don't use an old cached copy -->
  <link rel="stylesheet" href="style.css?v=3">
</head>
<body>
  <main>
    <h1>Orb Runner</h1>
    <div class="stage">
      <canvas id="game" width="640" height="480"></canvas>
      <button id="start-btn" type="button">Start</button>
    </div>
    <button id="pause-btn" type="button">Pause</button>
    <p class="help help-keys">Move with arrow keys or WASD. Collect gold orbs, avoid red blocks. Space to start, P to pause.</p>
    <p class="help help-touch">Drag anywhere on the game to move. Collect gold orbs, avoid red blocks.</p>
  </main>
  <script src="game.js?v=3"></script>
</body>
</html>
